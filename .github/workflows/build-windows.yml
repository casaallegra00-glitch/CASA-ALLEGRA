name: Build CASA ALLEGRA Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preparar npm
        shell: pwsh
        run: |
          npm --version
          node --version
          if (-not (Test-Path package.json)) {
            Write-Error 'No se encontró package.json en la raíz del repositorio.'
            exit 1
          }

      - name: Preparar dependencias
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'No se pudieron instalar las dependencias.'
            exit 1
          }
          if (-not (Test-Path package-lock.json)) {
            Write-Error 'npm no pudo generar package-lock.json.'
            exit 1
          }
          Write-Host 'Dependencias y package-lock.json listos.'

      - name: Verificar dependencias críticas
        shell: pwsh
        run: |
          npm ls electron electron-builder next react react-dom --depth=0
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Las dependencias críticas no pudieron instalarse correctamente.'
            exit 1
          }

      - name: Verificar build web
        run: npm run build

      - name: Generar instalador
        run: npm run dist

      - name: Verificar instalador
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'CASA-ALLEGRA-APP-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'No se encontró el instalador CASA-ALLEGRA-APP-Setup-*-x64.exe en dist.'
            exit 1
          }
          Write-Host "Instalador generado: $($installer.FullName)"
          Write-Host "Tamaño: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: CASA-ALLEGRA-Windows
          path: dist/CASA-ALLEGRA-APP-Setup-*-x64.exe
          if-no-files-found: error

      - name: Subir lockfile generado
        uses: actions/upload-artifact@v4
        with:
          name: CASA-ALLEGRA-package-lock
          path: package-lock.json
          if-no-files-found: error
