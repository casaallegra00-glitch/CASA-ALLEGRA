name: Build CASA ALLEGRA Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Generar instalador
        run: npm run dist

      - name: Verificar instalador
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'CASA-ALLEGRA-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'No se encontró el instalador CASA-ALLEGRA-Setup-*-x64.exe en dist.'
            exit 1
          }
          Write-Host "Instalador generado: $($installer.FullName)"

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: CASA-ALLEGRA-Windows
          path: dist/CASA-ALLEGRA-Setup-*-x64.exe
          if-no-files-found: error
