name: Deploy CASA ALLEGRA Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar versión web CASA ALLEGRA
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f casa-allegra-enhancements.js
          test -f casa-allegra-ai.js
          test -f casa-allegra-store.js
          test -f casa-allegra-pagos-envios.js
          test -f casa-allegra-pro.js
          test -f casa-allegra-multishop.js
          test -f casa-allegra-pro-dashboard.js
          test -f casa-allegra-analytics.js
          touch .nojekyll

      - name: Crear artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar CASA ALLEGRA
        id: deployment
        uses: actions/deploy-pages@v4
